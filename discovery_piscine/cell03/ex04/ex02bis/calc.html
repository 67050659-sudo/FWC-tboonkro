<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    
    <div class="calculator-row">
        <div class="box">
            <input type="text"/>
        </div>
        <div class="operators">
            <button id='addition' type="button">+</button>
            <button id='subtract' type="button">-</button>
            <button id='multiply' type="button">*</button>
            <button id='divide' type="button">/</button>
            <button id='percent' type="button">%</button>
        </div>
        <div class="box">
            <input type="text"/>
        </div>
    </div>

    <div class="submit_button">
        <button id="submit" type="button">Try me!</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="calc.js"></script>
</body>
</html>
